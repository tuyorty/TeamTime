server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Защитные заголовки для страниц и API. Скрипты, стили и шрифты — только с самого сайта,
    # встраивать сайт в чужие фреймы нельзя. style-src 'unsafe-inline' нужен графикам (атрибуты style).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok"; }

    # SSE: без буферизации и с длинным таймаутом чтения.
    location /api/v1/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: иначе клиент подставит любой IP и обойдёт лимит входа.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: иначе клиент подставит любой IP и обойдёт лимит входа.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # Свой add_header в location отменил бы защитные заголовки сервера, поэтому только expires.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
