name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Бэкенд · lint, типы, тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamtime
          POSTGRES_PASSWORD: teamtime
          POSTGRES_DB: teamtime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamtime"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Миграции применяются и откатываются
        env:
          DATABASE_URL: postgresql+asyncpg://teamtime:teamtime@localhost:5432/teamtime_test
        run: |
          teamtime db upgrade
          alembic downgrade base
          teamtime db upgrade
          alembic check
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://teamtime:teamtime@localhost:5432/teamtime_test
        run: pytest --cov --cov-report=term --cov-report=xml

  frontend:
    name: Фронтенд · lint, типы, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contrast
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E · Playwright на docker compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Поднять стек в демо-режиме
        env:
          DEMO: "1"
        run: |
          echo "DEMO=1" > .env
          docker compose up -d --build --wait db api web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Смоук-тесты
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test --project=smoke
      - name: Логи при падении
        if: failure()
        run: docker compose logs api web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    name: Утечки секретов · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
